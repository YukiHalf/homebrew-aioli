# On a tag (v1.2.3): build the binaries, publish a GitHub release, and point the brew formula at them.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: build
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; d=aioli_${V}_${os}_${arch}
            mkdir -p "dist/$d"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" -o "dist/$d/aioli" ./cmd/aioli
            cp README.md LICENSE "dist/$d/"
            tar -C dist -czf "dist/$d.tar.gz" "$d"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt && cat checksums.txt)
      - name: publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
      - name: update the formula
        run: |
          V=${GITHUB_REF_NAME#v}
          sha() { grep "_$1.tar.gz" dist/checksums.txt | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$V/g" \
              -e "s/@DARWIN_ARM64@/$(sha darwin_arm64)/" -e "s/@DARWIN_AMD64@/$(sha darwin_amd64)/" \
              -e "s/@LINUX_ARM64@/$(sha linux_arm64)/" -e "s/@LINUX_AMD64@/$(sha linux_amd64)/" \
              packaging/aioli.rb.tmpl > Formula/aioli.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main && git checkout -q main
          git add Formula/aioli.rb
          git commit -m "aioli $V" && git push origin main
